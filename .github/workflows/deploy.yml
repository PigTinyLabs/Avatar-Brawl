name: Deploy GameWeb

on:
  push:
    branches:
      - main

# Cấp quyền cho GitHub Actions có thể deploy lên GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook (Backend)
        run: |
          echo "Bắt đầu trigger deploy cho Backend trên Render..."
          curl -X GET "${{ secrets.RENDER_DEPLOY_HOOK }}"
          echo "Đã gửi tín hiệu deploy thành công!"
      
      - name: Wait for Backend
        run: |
          echo "Đợi 60 giây để Backend khởi động xong..."
          sleep 60

  deploy-frontend:
    needs: deploy-backend
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './client/package-lock.json'

      - name: Install dependencies
        working-directory: ./client
        run: npm install

      - name: Build frontend
        working-directory: ./client
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './client/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
