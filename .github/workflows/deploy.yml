name: Deploy GameWeb

on:
  push:
    branches:
      - main

# Cấp quyền cho GitHub Actions có thể deploy lên GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Job 1: Kiểm tra xem thư mục nào có sự thay đổi code
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'server/**'
            frontend:
              - 'client/**'
              - '.github/workflows/**'

  # Job 2: Deploy Backend (Chỉ chạy khi có thay đổi trong thư mục server/)
  deploy-backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook (Backend)
        run: |
          echo "Bắt đầu trigger deploy cho Backend trên Render..."
          curl -X GET "${{ secrets.RENDER_DEPLOY_HOOK }}"
          echo "Đã gửi tín hiệu deploy thành công!"
      
      - name: Wait for Backend
        run: |
          echo "Đợi 60 giây để Backend khởi động xong..."
          sleep 60

  # Job 3: Deploy Frontend (Chỉ chạy khi có thay đổi trong thư mục client/ hoặc workflow)
  deploy-frontend:
    needs: [changes, deploy-backend]
    # 'always()' đảm bảo nó chạy kể cả khi job deploy-backend bị skip, nhưng vẫn phải thoả mãn điều kiện frontend == true
    if: ${{ always() && needs.changes.outputs.frontend == 'true' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './client/package-lock.json'

      - name: Install dependencies
        working-directory: ./client
        run: npm install

      - name: Build frontend
        working-directory: ./client
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './client/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
